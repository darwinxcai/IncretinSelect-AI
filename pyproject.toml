[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "incretinselect-ai"
version = "0.7.0"
description = "Reproducible ridge benchmark and browser/CLI tool for incretin cAMP EC50 estimation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Darwin Cai"}]
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "DATA_LICENSE.md"]
keywords = ["GPCR", "incretin", "peptide", "machine learning", "bioinformatics"]
dependencies = ["numpy>=1.24,<3"]

[project.urls]
Homepage = "https://darwinxcai.github.io/IncretinSelect-AI/"
Repository = "https://github.com/darwinxcai/IncretinSelect-AI"
Documentation = "https://github.com/darwinxcai/IncretinSelect-AI#readme"

[project.optional-dependencies]
data = ["openpyxl>=3.1,<4"]
plot = ["matplotlib>=3.8,<4"]
dev = ["matplotlib>=3.8,<4", "openpyxl>=3.1,<4", "ruff==0.16.4", "setuptools>=77"]

[project.scripts]
incretin-validate = "incretinselect.activity:main"
incretin-structures = "incretinselect.structures:main"
incretin-fetch = "incretinselect.sources:main"
incretin-predict = "incretinselect.cli:main"
incretin-screen = "incretinselect.screen:main"
incretin-web = "incretinselect.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
incretinselect = [
  "assets/*.json",
  "notices/*",
  "resources/*.csv",
  "resources/*.json",
  "web_assets/*.css",
  "web_assets/*.html",
  "web_assets/*.json",
  "web_assets/*.mjs",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# This preparation script is checksum-locked as part of the pre-score receipt.
"scripts/freeze_external_predictions.py" = ["I001"]
