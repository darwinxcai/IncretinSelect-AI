name: Deploy browser demo

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  manual_ci:
    name: Manual deployment CI (Python ${{ matrix.python-version }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: make test
      - name: Product smoke test
        run: |
          make product-smoke
          incretin-predict --example --format json > /tmp/incretin-example.json
          incretin-web --smoke-test
      - name: Verify zero-install browser demo
        run: make static-demo
      - name: Verify built distribution
        run: make release-check
      - name: Audit release readiness
        run: make release-readiness
      - name: Install browser-test dependencies
        if: matrix.python-version == '3.12'
        run: npm ci
      - name: Install Chromium
        if: matrix.python-version == '3.12'
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance and accessibility tests
        if: matrix.python-version == '3.12'
        run: make browser-acceptance

  verify:
    needs: manual_ci
    if: >-
      always() &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event != 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_sha == github.sha
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          needs.manual_ci.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Require validated SHA to remain current
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VALIDATED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          checked_out_sha="$(git rev-parse HEAD)"
          current_default_sha="$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}")"
          if [ "${checked_out_sha}" != "${VALIDATED_SHA}" ]; then
            echo "::error::Checked-out SHA does not match the validated SHA."
            exit 1
          fi
          if [ "${current_default_sha}" != "${VALIDATED_SHA}" ]; then
            echo "::error::Validated SHA is no longer the default-branch HEAD."
            exit 1
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install inference package
        run: python -m pip install -e .
      - name: Verify browser demo
        run: make static-demo
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs

  deploy:
    if: always() && needs.verify.result == 'success'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
